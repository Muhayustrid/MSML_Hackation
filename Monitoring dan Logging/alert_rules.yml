groups:
  - name: bank_marketing_alerts
    rules:
      - alert: ModelServiceDown
        expr: up{job="bank-marketing-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Bank marketing model is down"
          description: "model_up has been 0 for more than 1 minute."

      - alert: HighPredictionErrorRate
        expr: |
          (
            sum(rate(prediction_errors_total[5m]))
            /
            clamp_min(sum(rate(prediction_requests_total[5m])), 1e-9)
          ) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High prediction error rate"
          description: "More than 20% of prediction requests are failing."

      - alert: HighPredictionLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(prediction_latency_seconds_bucket[5m])) by (le)
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High P95 prediction latency"
          description: "P95 prediction latency exceeds 1 second."
